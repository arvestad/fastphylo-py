name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest      # Linux x86_64 (manylinux)
          - macos-14           # macOS arm64 runner — builds universal2 wheel

    # Shared with the "Verify expected wheels" step below, not just the
    # actual cibuildwheel step - both need to agree on which Python
    # versions we expect, or the check can't do its job.
    env:
      CIBW_BUILD: "cp312-* cp313-*"
      CIBW_SKIP: "*-musllinux_*"        # skip musl (Alpine); glibc only
      CIBW_ARCHS_LINUX: x86_64
      CIBW_ARCHS_MACOS: universal2      # single wheel covers x86_64 + arm64
      CIBW_BEFORE_ALL_LINUX: "yum install -y epel-release && yum install -y blas-devel lapack-devel eigen3-devel"
      CIBW_TEST_COMMAND: "python -c \"import fastphylo; print(fastphylo.__version__)\""

    steps:
      - uses: actions/checkout@v6
        with:
          # extern/fastphylo (the libfastphylo submodule) - see
          # tests.yml's identical fix for why this is required now.
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # libfastphylo needs BLAS/LAPACK/Eigen3 available *inside*
      # cibuildwheel's own build environment, not just on this job's
      # host runner. Linux builds happen inside a manylinux2014
      # (CentOS 7 / yum) container - verified for real with a local
      # Colima+cibuildwheel run (2026-08-12): plain `yum install
      # eigen3-devel` 404s (not in the base repos), needs epel-release
      # first. macOS builds run directly on the host runner (no
      # container), so a plain `brew install` step beforehand is
      # enough - also verified locally, including the universal2
      # (x86_64+arm64) cross-build specifically.
      - name: Install libfastphylo's build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen simde

      # 2026-08-12: cibuildwheel v2.19 (the pin 1.1.0 actually shipped
      # with) predates Python 3.13's real release (Oct 2024) and simply
      # doesn't know cp313 is a valid build target - CIBW_BUILD's
      # "cp313-*" silently matched nothing, no error, no skip message
      # anywhere in the log. That's why 1.1.0 on PyPI only has cp312
      # wheels. Bumping the pin (below) fixes it for now, but the same
      # silent gap will recur for every future CPython release unless
      # something actually checks for it - this step is that check,
      # independent of whether anyone remembers to keep the pin current.
      - name: Verify cibuildwheel will actually build every Python version we expect
        run: |
          python3 -m pip install --quiet "cibuildwheel==2.23.*"
          python3 -m cibuildwheel --print-build-identifiers --platform auto | tee /tmp/cibw-identifiers.txt
          missing=0
          for py in cp312 cp313; do
            if ! grep -q "^${py}-" /tmp/cibw-identifiers.txt; then
              echo "::error::cibuildwheel will NOT build '${py}-*', even though CIBW_BUILD says it should - it silently doesn't recognize this Python version as a build target (this is exactly how 1.1.0 shipped without cp313 wheels, see CHANGELOG.md). Bump the pypa/cibuildwheel version pin below to one that supports ${py}."
              missing=1
            fi
          done
          exit $missing

      - uses: pypa/cibuildwheel@v2.23

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # Still unverified: whether scikit-build-core's sdist step
      # actually includes extern/fastphylo's checked-out files in the
      # resulting tarball, or only tracks them as the submodule gitlink
      # (which a later `pip install` from the sdist alone couldn't
      # resolve, having no .git history to fetch from) - the
      # fastphylo_py_integration_plan.md open question about `git
      # archive --recurse-submodules` vs. this build backend's own
      # mechanism, not resolved here.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
