name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest      # Linux x86_64 (manylinux)
          - macos-14           # macOS arm64 runner — builds universal2 wheel

    steps:
      - uses: actions/checkout@v6
        with:
          # extern/fastphylo (the libfastphylo submodule) - see
          # tests.yml's identical fix for why this is required now.
          submodules: recursive

      # libfastphylo needs BLAS/LAPACK/Eigen3 available *inside*
      # cibuildwheel's own build environment, not just on this job's
      # host runner. Linux builds happen inside a manylinux2014
      # (CentOS 7 / yum) container - verified for real with a local
      # Colima+cibuildwheel run (2026-08-12): plain `yum install
      # eigen3-devel` 404s (not in the base repos), needs epel-release
      # first. macOS builds run directly on the host runner (no
      # container), so a plain `brew install` step beforehand is
      # enough - also verified locally, including the universal2
      # (x86_64+arm64) cross-build specifically.
      - name: Install libfastphylo's build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen simde

      # v2.19 (the pin the 1.1.0 release actually shipped with) predates
      # Python 3.13's real release (Oct 2024) and simply doesn't know
      # cp313 is a valid build target - CIBW_BUILD's "cp313-*" silently
      # matched nothing, no error, no skip message. Confirmed directly
      # (2026-08-12): a local run under 2.19.2 planned only
      # "cp312-manylinux_x86_64"; the same run under 2.23.4 planned
      # "cp312-manylinux_x86_64, cp313-manylinux_x86_64" - both actually
      # attempted. This is why 1.1.0 on PyPI only has cp312 wheels.
      - uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"        # skip musl (Alpine); glibc only
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: universal2      # single wheel covers x86_64 + arm64
          CIBW_BEFORE_ALL_LINUX: "yum install -y epel-release && yum install -y blas-devel lapack-devel eigen3-devel"
          CIBW_TEST_COMMAND: "python -c \"import fastphylo; print(fastphylo.__version__)\""

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # Still unverified: whether scikit-build-core's sdist step
      # actually includes extern/fastphylo's checked-out files in the
      # resulting tarball, or only tracks them as the submodule gitlink
      # (which a later `pip install` from the sdist alone couldn't
      # resolve, having no .git history to fetch from) - the
      # fastphylo_py_integration_plan.md open question about `git
      # archive --recurse-submodules` vs. this build backend's own
      # mechanism, not resolved here.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.0
